<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор бюджета</title>
  <style>
    :root {
      --calc-width: 352px;
      --calc-radius: 14px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .calc {
      border: 1px solid #ccc;
      padding: 22px;
      border-radius: var(--calc-radius);
      width: min(var(--calc-width), calc(100vw - 24px));
      background: #fff;
      box-shadow: var(--shadow);
    }

    input {
      width: 100%;
      padding: 8.8px;
      margin: 5.5px 0;
      font-size: 17.6px;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
    }

    .result {
      margin-top: 11px;
      font-size: 17.6px;
    }

    .label {
      font-weight: bold;
      margin-top: 11px;
      display: block;
      font-size: 17.6px;
    }
  </style>
</head>
<body>
  <div class="calc">
    <label class="label">Реальный техкост (15%):</label>
    <input
      type="text"
      inputmode="numeric"
      id="cost"
      placeholder="Например: 500 000"
      oninput="handleCostInput(event)"
    >

    <div class="result">Для СЛ (20%): <span id="sl">-</span></div>
    <div class="result">Для клиента (25%): <span id="client">-</span></div>
    <div class="result">Бюджет (100%): <span id="budget">-</span></div>
  </div>

  <script>
    function formatNumber(value) {
      return value.toLocaleString('ru-RU');
    }

    function parseDigits(value) {
      return value.replace(/\D/g, '');
    }

    function handleCostInput(event) {
      const digits = parseDigits(event.target.value);

      if (!digits) {
        event.target.value = '';
        calculate();
        return;
      }

      event.target.value = formatNumber(Number(digits));
      calculate();
    }

    function calculate() {
      const rawValue = parseDigits(document.getElementById('cost').value);
      const cost = Number(rawValue);

      if (!cost || cost <= 0) {
        document.getElementById('sl').textContent = '-';
        document.getElementById('client').textContent = '-';
        document.getElementById('budget').textContent = '-';
        return;
      }

      const budget = cost / 0.15;
      const sl = budget * 0.20;
      const client = budget * 0.25;

      document.getElementById('sl').textContent = formatNumber(Math.round(sl));
      document.getElementById('client').textContent = formatNumber(Math.round(client));
      document.getElementById('budget').textContent = formatNumber(Math.round(budget));
    }
  </script>
</body>
</html>
