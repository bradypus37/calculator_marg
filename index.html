<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Калькулятор проекта</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f7;
    color: #111;
  }

  .wrap {
    max-width: 1220px;
    margin: 40px auto;
    padding: 0 20px;
  }

  h1 {
    font-size: 28px;
    margin: 0 0 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 24px;
    align-items: start;
  }

  .card {
    background: #fff;
    border: 1px solid #d9dde1;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.04);
  }

  .card.over {
    border-color: #d83232;
    box-shadow: 0 0 0 1px #d83232;
  }

  .card h2 {
    font-size: 20px;
    margin: 0 0 18px;
  }

  .mode {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .mode button {
    flex: 1;
    border: 1px solid #cfd4d8;
    background: #fff;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
  }

  .mode button.active {
    background: #111;
    color: #fff;
    border-color: #111;
  }

  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 7px;
  }

  input,
  select {
    width: 100%;
    height: 42px;
    border: 1px solid #cfd4d8;
    border-radius: 8px;
    padding: 0 12px;
    background: #fff;
    font-size: 15px;
  }

  input::placeholder {
    color: #9aa2a9;
  }

  .results {
    margin-top: 20px;
    border-top: 1px solid #eceff1;
  }

  .result {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid #eceff1;
    font-size: 15px;
  }

  .result strong {
    white-space: nowrap;
  }

  .limit {
    padding: 14px;
    border-radius: 10px;
    background: #f0f5ee;
    margin-bottom: 18px;
  }

  .limit small {
    display: block;
    color: #59625a;
    margin-bottom: 5px;
  }

  .limit strong {
    font-size: 21px;
  }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cost-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.8fr 36px;
    gap: 8px;
    align-items: center;
  }

  .custom-name {
    display: none;
  }

  .cost-row.other .custom-name {
    display: block;
  }

  .remove {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: #f0f1f2;
    cursor: pointer;
    font-size: 18px;
  }

  .add {
    margin-top: 12px;
    width: 100%;
    height: 42px;
    border: 1px dashed #aeb5ba;
    background: #fff;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
  }

  .summary {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #e1e4e6;
  }

  .summary-line {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 8px 0;
  }

  .summary-line.total,
  .summary-line.saving {
    font-size: 18px;
    font-weight: 700;
  }

  .negative {
    color: #d21f1f;
  }

  @media (max-width: 980px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 680px) {
    .cost-row {
      grid-template-columns: 1fr;
    }

    .remove {
      width: 100%;
      height: 40px;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>Калькулятор проекта</h1>

  <div class="grid">

    <!-- КАЛЬКУЛЯТОР МАРЖИНАЛЬНОСТИ -->

    <section class="card">

      <h2>Маржинальность</h2>

      <div class="mode">
        <button id="modeTech" class="active">
          От техкоста
        </button>

        <button id="modeBudget">
          От бюджета
        </button>
      </div>

      <label id="mainLabel" for="mainInput">
        Реальный техкост, ₽
      </label>

      <input
        id="mainInput"
        type="number"
        min="0"
        step="1000"
        inputmode="numeric"
        value=""
        placeholder="Введите сумму"
      />

      <div class="results">

        <div class="result" id="budgetRow">
          <span>Бюджет (100%)</span>
          <strong id="budgetResult">—</strong>
        </div>

        <div class="result">
          <span>СЛ (20%)</span>
          <strong id="slResult">—</strong>
        </div>

        <div class="result">
          <span>Кост клиента (25%)</span>
          <strong id="clientResult">—</strong>
        </div>

        <div
          class="result"
          id="techRow"
          style="display: none;"
        >
          <span>Реальный техкост (15%)</span>
          <strong id="techResult">—</strong>
        </div>

      </div>

    </section>


    <!-- КАЛЬКУЛЯТОР СОСТАВА ТЕХКОСТА -->

    <section
      class="card"
      id="projectCard"
    >

      <h2>Рассчитать техкост</h2>

      <div class="limit">

        <small>
          Максимально доступный техкост
        </small>

        <strong id="techLimit">
          —
        </strong>

      </div>

      <div
        class="rows"
        id="rows"
      ></div>

      <button
        class="add"
        id="addRow"
      >
        + Добавить работу
      </button>

      <div class="summary">

        <div class="summary-line total">

          <span>
            Реальные затраты
          </span>

          <span id="realCosts">
            0 ₽
          </span>

        </div>

        <div class="summary-line saving">

          <span>
            Экономия
          </span>

          <span id="savingValue">
            —
          </span>

        </div>

      </div>

    </section>

  </div>

</div>

  const TECH_SHARE = 0.15;

  const CLIENT_COST_SHARE = 0.25;


  let mode = 'tech';


  /* =========================
     DOM
  ========================= */


  const els = {

    mainInput:
      document.getElementById('mainInput'),

    modeTech:
      document.getElementById('modeTech'),

    modeBudget:
      document.getElementById('modeBudget'),

    mainLabel:
      document.getElementById('mainLabel'),

    budgetRow:
      document.getElementById('budgetRow'),

    techRow:
      document.getElementById('techRow'),

    budgetResult:
      document.getElementById('budgetResult'),

    slResult:
      document.getElementById('slResult'),

    clientResult:

    techResult:
      document.getElementById('techResult'),

      document.getElementById('techLimit'),

    rows:
      document.getElementById('rows'),

    projectCard:
      document.getElementById('projectCard'),

    realCosts:
      document.getElementById('realCosts'),

    savingValue:
      document.getElementById('savingValue'),

    addRow:
      document.getElementById('addRow')

  };


  /* =========================
     ФОРМАТИРОВАНИЕ
  ========================= */


  const formatMoney = (value) => {

    return new Intl.NumberFormat(
      'ru-RU',
      {
        maximumFractionDigits: 0
      }
    ).format(Number(value) || 0) + ' ₽';

  };


  /* =========================
     ОСНОВНОЙ КАЛЬКУЛЯТОР
  ========================= */


  const hasMainValue = () => {

    return (
      els.mainInput.value.trim() !== '' &&
      Number.isFinite(
        Number(els.mainInput.value)
      ) &&
      Number(els.mainInput.value) >= 0
    );

  };


  const getAvailableTechCost = () => {

    if (!hasMainValue()) {

      return null;

    }


    const value =
      Number(els.mainInput.value);


    if (mode === 'tech') {

      return value;

    }


    return value * TECH_SHARE;

  };


  const updateMargin = () => {

    if (!hasMainValue()) {

      els.budgetResult.textContent = '—';

      els.slResult.textContent = '—';

      els.clientResult.textContent = '—';

      els.techResult.textContent = '—';

      updateProject();

      return;

    }


    const value =
      Number(els.mainInput.value);


    const budget =
      mode === 'tech'
        ? value / TECH_SHARE
        : value;


    const tech =
      mode === 'tech'
        ? value
        : value * TECH_SHARE;


    els.budgetResult.textContent =
      formatMoney(budget);


    els.slResult.textContent =
      formatMoney(
        budget * SL_SHARE
      );


    els.clientResult.textContent =
      formatMoney(
        budget * CLIENT_COST_SHARE
      );


    els.techResult.textContent =
      formatMoney(tech);


    updateProject();

  };
