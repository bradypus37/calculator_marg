<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Калькулятор проекта</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f7;
    color: #111;
  }

  .wrap {
    max-width: 1220px;
    margin: 40px auto;
    padding: 0 20px;
  }

  h1 {
    font-size: 28px;
    margin: 0 0 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 24px;
    align-items: start;
  }

  .card {
    background: #fff;
    border: 1px solid #d9dde1;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 3px 14px rgba(0,0,0,.04);
  }

  .card.over {
    border-color: #d83232;
    box-shadow: 0 0 0 1px #d83232;
  }

  .card h2 {
    font-size: 20px;
    margin: 0 0 18px;
  }

  .mode {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .mode button {
    flex: 1;
    border: 1px solid #cfd4d8;
    background: #fff;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
  }

  .mode button.active {
    background: #111;
    color: #fff;
    border-color: #111;
  }

  label {
    display: block;
    font-size: 15px;
    color: #555;
    margin-bottom: 7px;
  }

  input, select {
    width: 100%;
    height: 42px;
    border: 1px solid #cfd4d8;
    border-radius: 8px;
    padding: 0 12px;
    background: #fff;
    font-size: 15px;
  }

  input::placeholder {
    color: #9aa2a9;
  }

  .results {
    margin-top: 20px;
    border-top: 1px solid #eceff1;
  }

  .result {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid #eceff1;
    font-size: 15px;
  }

  .result strong {
    white-space: nowrap;
  }

  .limit {
    padding: 14px;
    border-radius: 10px;
    background: #f0f5ee;
    margin-bottom: 18px;
  }

  .limit small {
    display: block;
    color: #59625a;
    margin-bottom: 5px;
  }

  .limit strong {
    font-size: 21px;
  }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cost-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr .8fr 36px;
    gap: 8px;
    align-items: center;
  }

  .custom-name {
    display: none;
  }

  .cost-row.other .custom-name {
    display: block;
  }

  .remove {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: #f0f1f2;
    cursor: pointer;
    font-size: 18px;
  }

  .add {
    margin-top: 12px;
    width: 100%;
    height: 42px;
    border: 1px dashed #aeb5ba;
    background: #fff;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
  }

  .summary {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #e1e4e6;
  }

  .summary-line {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 8px 0;
  }

  .summary-line.total,
  .summary-line.saving {
    font-size: 18px;
    font-weight: 700;
  }

  .negative {
    color: #d21f1f;
  }

  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 680px) {
    .cost-row { grid-template-columns: 1fr; }
    .remove { width: 100%; height: 40px; }
  }
</style>
</head>

<body>

<div class="wrap">
  <h1>Калькулятор проекта</h1>

  <div class="grid">

    <section class="card">
      <h2>Маржинальность</h2>

      <div class="mode">
        <button id="modeTech" class="active">От техкоста</button>
        <button id="modeBudget">От бюджета</button>
      </div>

      <label id="mainLabel" for="mainInput">
        Реальный техкост (15%), ₽
      </label>

      <input
        id="mainInput"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        value=""
        placeholder="Введите сумму"
      />

      <div class="results">

        <div class="result" id="techRow">
          <span>Реальный техкост (15%)</span>
          <strong id="techResult">—</strong>
        </div>

        <div class="result" id="slRow">
          <span>20%</span>
          <strong id="slResult">—</strong>
        </div>

        <div class="result" id="clientRow">
          <span>Кост клиента (25%)</span>
          <strong id="clientResult">—</strong>
        </div>

        <div class="result" id="budgetRow">
          <span>Бюджет (100%)</span>
          <strong id="budgetResult">—</strong>
        </div>

      </div>
    </section>


    <section class="card" id="projectCard">
      <h2>Рассчитать техкост</h2>

      <div class="limit">
        <small>Максимально доступный техкост</small>
        <strong id="techLimit">—</strong>
      </div>

      <div class="rows" id="rows"></div>

      <button class="add" id="addRow">
        + Добавить работу
      </button>

      <div class="summary">
        <div class="summary-line total">
          <span>Реальные затраты</span>
          <span id="realCosts">0 ₽</span>
        </div>

        <div class="summary-line saving">
          <span>Экономия</span>
          <span id="savingValue">—</span>
        </div>
      </div>
    </section>

  </div>
</div>


<script>
(() => {
  'use strict';

  const SERVICES = [
    { name: 'Верстка и программинг проекта', defaultCost: null },
    { name: 'Написание текстов', defaultCost: null },
    { name: 'Настройка аналитики', defaultCost: 15000 },
    { name: 'Дизайн', defaultCost: null },
    { name: 'Закупка трафика', defaultCost: null },
    { name: 'Другое', defaultCost: null }
  ];

  const TECH_SHARE = 0.15;
  const SL_SHARE = 0.20;
  const CLIENT_COST_SHARE = 0.25;

  let mode = 'tech';

  const els = {
    mainInput: document.getElementById('mainInput'),
    modeTech: document.getElementById('modeTech'),
    modeBudget: document.getElementById('modeBudget'),
    mainLabel: document.getElementById('mainLabel'),

    techRow: document.getElementById('techRow'),
    slRow: document.getElementById('slRow'),
    clientRow: document.getElementById('clientRow'),
    budgetRow: document.getElementById('budgetRow'),

    techResult: document.getElementById('techResult'),
    slResult: document.getElementById('slResult'),
    clientResult: document.getElementById('clientResult'),
    budgetResult: document.getElementById('budgetResult'),

    techLimit: document.getElementById('techLimit'),
    rows: document.getElementById('rows'),
    projectCard: document.getElementById('projectCard'),
    realCosts: document.getElementById('realCosts'),
    savingValue: document.getElementById('savingValue'),
    addRow: document.getElementById('addRow')
  };

  const parseMoneyInput = (value) => {
    const digits = String(value).replace(/\D/g, '');
    return digits ? Number(digits) : null;
  };

  const formatMoneyInput = (value) => {
    const numeric = parseMoneyInput(value);
    if (numeric === null) return '';

    return new Intl.NumberFormat('ru-RU', {
      maximumFractionDigits: 0
    }).format(numeric);
  };

  const formatMoney = (value) => {
    return new Intl.NumberFormat('ru-RU', {
      maximumFractionDigits: 0
    }).format(Number(value) || 0) + ' ₽';
  };

  const hasMainValue = () => {
    const value = parseMoneyInput(els.mainInput.value);
    return value !== null && Number.isFinite(value) && value >= 0;
  };

  const getAvailableTechCost = () => {
    if (!hasMainValue()) return null;

    const value = parseMoneyInput(els.mainInput.value);

    return mode === 'tech'
      ? value
      : value * TECH_SHARE;
  };

  const calculateRealCosts = () => {
    let total = 0;

    els.rows.querySelectorAll('.cost-input').forEach((input) => {
      const value = parseMoneyInput(input.value);
      if (
        value !== null &&
        Number.isFinite(value) &&
        value > 0
      ) {
        total += value;
      }
    });

    return total;
  };

  const updateProject = () => {
    const limit = getAvailableTechCost();
    const costs = calculateRealCosts();

    els.realCosts.textContent = formatMoney(costs);

    if (limit === null) {
      els.techLimit.textContent = '—';
      els.savingValue.textContent = '—';
      els.savingValue.classList.remove('negative');
      els.projectCard.classList.remove('over');
      return;
    }

    els.techLimit.textContent = formatMoney(limit);

    const saving = limit - costs;
    const isOver = saving < 0;

    els.savingValue.textContent =
      (isOver ? '−' : '') + formatMoney(Math.abs(saving));

    els.savingValue.classList.toggle('negative', isOver);
    els.projectCard.classList.toggle('over', isOver);
  };

  const updateMargin = () => {
    if (!hasMainValue()) {
      els.techResult.textContent = '—';
      els.slResult.textContent = '—';
      els.clientResult.textContent = '—';
      els.budgetResult.textContent = '—';
      updateProject();
      return;
    }

    const value = parseMoneyInput(els.mainInput.value);

    const budget =
      mode === 'tech'
        ? value / TECH_SHARE
        : value;

    const tech =
      mode === 'tech'
        ? value
        : value * TECH_SHARE;

    els.techResult.textContent = formatMoney(tech);
    els.slResult.textContent = formatMoney(budget * SL_SHARE);
    els.clientResult.textContent = formatMoney(budget * CLIENT_COST_SHARE);
    els.budgetResult.textContent = formatMoney(budget);

    updateProject();
  };

  const createServiceSelect = () => {
    const select = document.createElement('select');

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Выберите работу';
    select.appendChild(placeholder);

    SERVICES.forEach(({ name }) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });

    return select;
  };

  const addCostRow = ({
    service = '',
    cost = '',
    customName = ''
  } = {}) => {

    const row = document.createElement('div');
    row.className = 'cost-row';

    const select = createServiceSelect();
    select.value = service;

    const customNameInput = document.createElement('input');
    customNameInput.type = 'text';
    customNameInput.placeholder = 'Название работы';
    customNameInput.className = 'custom-name';
    customNameInput.value = customName;

    const costInput = document.createElement('input');
    costInput.type = 'text';
    costInput.inputMode = 'numeric';
    costInput.autocomplete = 'off';
    costInput.placeholder = 'Стоимость, ₽';
    costInput.className = 'cost-input';
    costInput.value = cost ? formatMoneyInput(cost) : '';

    const removeButton = document.createElement('button');
    removeButton.className = 'remove';
    removeButton.type = 'button';
    removeButton.setAttribute('aria-label', 'Удалить работу');
    removeButton.textContent = '×';

    const refreshRowState = () => {
      const isOther = select.value === 'Другое';

      row.classList.toggle('other', isOther);
      customNameInput.required = isOther;

      if (!isOther) {
        customNameInput.value = '';
      }
    };

    select.addEventListener('change', () => {
      const selected = SERVICES.find(
        ({ name }) => name === select.value
      );

      if (selected?.defaultCost != null) {
        costInput.value = formatMoneyInput(selected.defaultCost);
      } else if (!select.value) {
        costInput.value = '';
      }

      refreshRowState();
      updateProject();
    });

    costInput.addEventListener('input', () => {
      const rawValue = costInput.value;
      const selectionStart =
        costInput.selectionStart ?? rawValue.length;

      const digitsBeforeCaret = rawValue
        .slice(0, selectionStart)
        .replace(/\D/g, '')
        .length;

      const formatted = formatMoneyInput(rawValue);
      costInput.value = formatted;

      if (formatted) {
        let digitCount = 0;
        let newCaretPosition = formatted.length;

        if (digitsBeforeCaret === 0) {
          newCaretPosition = 0;
        } else {
          for (let i = 0; i < formatted.length; i++) {
            if (/\d/.test(formatted[i])) {
              digitCount++;
            }

            if (digitCount >= digitsBeforeCaret) {
              newCaretPosition = i + 1;
              break;
            }
          }
        }

        costInput.setSelectionRange(
          newCaretPosition,
          newCaretPosition
        );
      }

      updateProject();
    });
    customNameInput.addEventListener('input', updateProject);

    removeButton.addEventListener('click', () => {
      row.remove();
      updateProject();
    });

    row.append(
      select,
      customNameInput,
      costInput,
      removeButton
    );

    els.rows.appendChild(row);

    refreshRowState();
    updateProject();
  };

  const setMode = (nextMode) => {
    mode = nextMode;

    const isTechMode = mode === 'tech';

    els.modeTech.classList.toggle('active', isTechMode);
    els.modeBudget.classList.toggle('active', !isTechMode);

    els.mainLabel.textContent = isTechMode
      ? 'Реальный техкост (15%), ₽'
      : 'Бюджет проекта, ₽';

    /*
      ОТ ТЕХКОСТА:
      СЛ (20%)
      Кост клиента (25%)
      Бюджет (100%)

      ОТ БЮДЖЕТА:
      Реальный техкост (15%)
      СЛ (20%)
      Кост клиента (25%)
    */

    els.techRow.style.display = isTechMode ? 'none' : 'flex';
    els.slRow.style.display = 'flex';
    els.clientRow.style.display = 'flex';
    els.budgetRow.style.display = isTechMode ? 'flex' : 'none';

    els.mainInput.value = formatMoneyInput(els.mainInput.value);

    updateMargin();
  };

  els.modeTech.addEventListener('click', () => setMode('tech'));
  els.modeBudget.addEventListener('click', () => setMode('budget'));

  els.mainInput.addEventListener('input', () => {
    const rawValue = els.mainInput.value;
    const selectionStart =
      els.mainInput.selectionStart ?? rawValue.length;

    const digitsBeforeCaret = rawValue
      .slice(0, selectionStart)
      .replace(/\D/g, '')
      .length;

    const formatted = formatMoneyInput(rawValue);
    els.mainInput.value = formatted;

    if (!formatted) {
      updateMargin();
      return;
    }

    let digitCount = 0;
    let newCaretPosition = formatted.length;

    if (digitsBeforeCaret === 0) {
      newCaretPosition = 0;
    } else {
      for (let i = 0; i < formatted.length; i++) {
        if (/\d/.test(formatted[i])) {
          digitCount++;
        }

        if (digitCount >= digitsBeforeCaret) {
          newCaretPosition = i + 1;
          break;
        }
      }
    }

    els.mainInput.setSelectionRange(
      newCaretPosition,
      newCaretPosition
    );

    updateMargin();
  });

  els.addRow.addEventListener(
    'click',
    () => addCostRow()
  );

  addCostRow({ service: 'Верстка и программинг проекта' });
  addCostRow({ service: 'Написание текстов' });
  addCostRow({ service: 'Настройка аналитики', cost: 15000 });
  addCostRow({ service: 'Дизайн' });
  addCostRow({ service: 'Закупка трафика' });

  setMode('tech');
})();
</script>

</body>
</html>
